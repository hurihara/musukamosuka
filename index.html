<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ムスカムスカ育成ゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪰</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e8f5e3;--bg2:#d4ecc8;--card:#ffffffcc;--border:#b5d9a0;
  --text:#2d4a1e;--text2:#5a7a48;--text3:#8aaa6a;
  --teal:#3aada0;--coral:#e07a5f;--pink:#d4537e;--amber:#c49a2a;--purple:#7f77dd;
}
body{font-family:'Zen Maru Gothic',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1rem;background-image:radial-gradient(circle at 10% 20%,rgba(90,200,150,0.15) 0%,transparent 50%),radial-gradient(circle at 90% 80%,rgba(58,173,160,0.12) 0%,transparent 50%);}
#app{width:100%;max-width:400px;}
.game-title{text-align:center;font-family:'Klee One',cursive;font-size:13px;color:var(--text3);letter-spacing:0.15em;margin-bottom:6px;padding-top:4px;}

/* タブ */
.tab-row{display:flex;gap:4px;margin-bottom:10px;}
.tab-btn{flex:1;font-size:12px;font-weight:700;padding:8px 4px;border-radius:12px;border:1.5px solid var(--border);background:#fff9;color:var(--text2);cursor:pointer;font-family:inherit;transition:all 0.2s;}
.tab-btn.active{background:var(--teal);color:#fff;border-color:var(--teal);}

/* ページ */
.page{display:none;}.page.active{display:block;}

.chara-card{background:var(--card);border:1.5px solid var(--border);border-radius:24px;padding:1.2rem 1rem 1rem;margin-bottom:10px;text-align:center;box-shadow:0 4px 20px rgba(90,160,80,0.12);position:relative;overflow:hidden;}
.chara-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(90,200,150,0.1),transparent 70%);pointer-events:none;}
#chara-img-wrap{width:180px;height:220px;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;}
#chara-img{max-width:100%;max-height:100%;object-fit:contain;transition:opacity 0.3s;}
.outfit-row{display:flex;justify-content:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.outfit-btn{font-size:11px;padding:4px 10px;border-radius:100px;border:1.5px solid var(--border);background:#fff8;color:var(--text2);cursor:pointer;transition:all 0.2s;font-family:inherit;}
.outfit-btn:hover{background:var(--bg2);border-color:var(--teal);}
.outfit-btn.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.chara-name{font-size:20px;font-weight:700;color:var(--text);font-family:'Klee One',cursive;}
.chara-level{font-size:12px;color:var(--text3);margin-top:1px;}
.mood-badge{display:inline-block;font-size:12px;padding:3px 14px;border-radius:100px;margin-top:6px;font-weight:500;transition:all 0.3s;}
.exp-row{display:flex;align-items:center;gap:6px;margin-top:10px;}
.exp-lbl,.exp-num{font-size:11px;color:var(--text3);white-space:nowrap;}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:1rem 1.1rem;margin-bottom:10px;box-shadow:0 2px 10px rgba(90,160,80,0.08);}
.section-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:0.1em;margin-bottom:9px;}
.stat-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.stat-label{font-size:12px;color:var(--text2);width:80px;flex-shrink:0;line-height:1.2;}
.bar-bg{flex:1;height:7px;border-radius:4px;background:rgba(0,0,0,0.07);overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 0.5s cubic-bezier(.34,1.56,.64,1);}
.stat-val{font-size:12px;font-weight:700;width:32px;text-align:right;color:var(--text);}
.special-stat .bar-bg{height:10px;border-radius:5px;}
.special-stat .stat-label{font-size:13px;}
.special-stat .stat-val{font-size:13px;}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
button.action-btn{cursor:pointer;font-family:'Zen Maru Gothic',sans-serif;font-size:13px;font-weight:500;padding:11px 8px;border-radius:14px;border:1.5px solid var(--border);background:#fff9;color:var(--text);transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:5px;}
button.action-btn:hover:not(:disabled){background:var(--bg2);border-color:var(--teal);transform:translateY(-1px);box-shadow:0 3px 10px rgba(58,173,160,0.2);}
button.action-btn:active:not(:disabled){transform:scale(0.97);}
button.action-btn:disabled{opacity:0.35;cursor:default;}
button.action-btn.highlight{border-color:var(--teal);background:rgba(58,173,160,0.1);}
.auto-wrap{display:flex;align-items:center;gap:7px;margin-top:10px;}
.auto-wrap input[type=checkbox]{accent-color:var(--teal);width:14px;height:14px;cursor:pointer;}
.auto-wrap label{font-size:12px;color:var(--text3);cursor:pointer;}
.log{font-size:13px;color:var(--text2);line-height:1.7;min-height:42px;}
.log-flash{animation:logfade 0.3s ease;}
@keyframes logfade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.snack-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.snack-chip{font-size:13px;padding:4px 10px;border-radius:100px;border:1.5px solid var(--border);background:#fff9;cursor:pointer;transition:all 0.2s;font-family:inherit;color:var(--text);}
.snack-chip:hover{background:var(--bg2);}
.snack-empty{font-size:12px;color:var(--text3);}

/* ========== お部屋 ========== */
#room-wrap{
  background:var(--card);border:1.5px solid var(--border);border-radius:18px;
  margin-bottom:10px;overflow:hidden;box-shadow:0 2px 10px rgba(90,160,80,0.08);
}
#room-canvas-wrap{
  position:relative;width:100%;height:280px;overflow:hidden;cursor:default;touch-action:none;
}
#room-bg{position:absolute;inset:0;transition:background 0.5s;}
#room-floor{position:absolute;bottom:0;left:0;right:0;height:72px;transition:background 0.5s;}

/* 家具 */
.furniture{
  position:absolute;font-size:28px;cursor:grab;user-select:none;
  transition:filter 0.15s;line-height:1;
}
.furniture:hover{filter:drop-shadow(0 0 6px rgba(58,173,160,0.6));}
.furniture.dragging{cursor:grabbing;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.25));z-index:10;}

/* むすむすSVGキャラ */
#room-musumu{position:absolute;bottom:72px;width:44px;height:60px;pointer-events:none;transition:left 2s linear;}

/* 部屋コントロール */
.room-controls{padding:10px 12px;border-top:1px solid var(--border);}
.room-ctrl-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.room-chip{font-size:11px;padding:4px 10px;border-radius:100px;border:1.5px solid var(--border);background:#fff9;cursor:pointer;font-family:inherit;color:var(--text2);transition:all 0.2s;}
.room-chip:hover{background:var(--bg2);}
.room-chip.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.room-subtitle{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:0.08em;margin-bottom:5px;}

/* 家具インベントリ */
.furniture-inv{display:flex;flex-wrap:wrap;gap:6px;}
.inv-item{font-size:22px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--border);background:#fff9;cursor:pointer;transition:all 0.2s;position:relative;}
.inv-item:hover{background:var(--bg2);border-color:var(--teal);}
.inv-badge{position:absolute;top:-4px;right:-4px;background:#d4537e;color:#fff;border-radius:100px;font-size:10px;padding:1px 5px;font-weight:700;}
.inv-empty{font-size:12px;color:var(--text3);}

/* なつき度プレゼント */
.gift-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.gift-item{font-size:12px;padding:5px 10px;border-radius:12px;border:1.5px solid var(--border);background:#fff9;color:var(--text2);}
.gift-item.unlocked{background:#d4f0e0;border-color:#3aada0;color:#2d8a60;cursor:pointer;}
.gift-item.unlocked:hover{background:#b8e8d0;}

/* モーダル共通 */
.modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:50;align-items:center;justify-content:center;}
.modal-wrap.show{display:flex;}
.modal-box{background:#fff;border-radius:24px;padding:1.5rem;max-width:300px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.15);}
.modal-title{font-size:15px;font-weight:700;color:var(--text);font-family:'Klee One',cursive;margin-bottom:8px;}
.modal-scene{font-size:40px;margin:10px 0;}
.modal-desc{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:12px;}
.modal-result{font-size:12px;color:var(--teal);font-weight:700;margin-bottom:14px;}
.modal-close{font-size:13px;padding:8px 24px;border-radius:100px;border:1.5px solid var(--border);background:var(--teal);color:#fff;cursor:pointer;font-family:inherit;}

/* 懐きモーダル */
.natsuki-box{background:#fff;border-radius:24px;padding:1.5rem 1.5rem 1.2rem;max-width:300px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(90,160,80,0.2);border:2px solid #b5d9a0;}
.natsuki-icon{font-size:52px;margin-bottom:8px;animation:fuwa 2s ease-in-out infinite;}
@keyframes fuwa{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.natsuki-title{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:0.1em;margin-bottom:10px;}
.natsuki-text{font-size:14px;color:var(--text);line-height:1.9;margin-bottom:14px;font-family:'Klee One',cursive;white-space:pre-line;}
.natsuki-close{font-size:13px;padding:8px 24px;border-radius:100px;border:1.5px solid var(--border);background:var(--teal);color:#fff;cursor:pointer;font-family:inherit;}

/* ギーーーッ */
#gii-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:99;}
.gii-msg{font-size:40px;font-weight:700;color:#2baa6a;font-family:'Zen Maru Gothic',sans-serif;display:none;border:3px solid #2baa6a;background:rgba(220,255,235,0.97);border-radius:100px;padding:12px 28px;}
.gii-msg.show{display:block;animation:gii 1.6s ease forwards;}
@keyframes gii{0%{opacity:0;transform:scale(0.4)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(0.95) rotate(-3deg)}35%{transform:scale(1.08) rotate(3deg)}45%{transform:scale(0.97) rotate(-2deg)}55%{transform:scale(1.04) rotate(1deg)}65%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0.9) translateY(-16px)}}

/* レベルアップ */
#lvup-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:99;}
.lvup-msg{font-size:28px;font-weight:700;color:#2d8a60;animation:lvup 1.3s ease forwards;display:none;font-family:'Klee One',cursive;}
@keyframes lvup{0%{opacity:0;transform:scale(0.6) translateY(20px)}35%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0.9) translateY(-20px)}}
.bounce{animation:bounce 0.4s ease;}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.1) rotate(-4deg)}70%{transform:scale(0.96) rotate(2deg)}}
.save-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.save-info{font-size:11px;color:var(--text3);}
.reset-btn{font-size:11px;padding:3px 10px;border-radius:100px;border:1px solid #e07a5f55;background:transparent;color:#e07a5f;cursor:pointer;font-family:inherit;}
.reset-btn:hover{background:#e07a5f18;}
</style>
</head>
<body>
<div id="app">
  <div class="game-title">✦ むすかむすか育成ゲーム ✦</div>
  <div class="save-row">
    <span class="save-info" id="save-info">💾 セーブデータなし</span>
    <button class="reset-btn" onclick="resetGame()">🗑 リセット</button>
  </div>

  <!-- タブ -->
  <div class="tab-row">
    <button class="tab-btn active" onclick="switchTab('育てる')" id="tab-育てる">🪰 育てる</button>
    <button class="tab-btn" onclick="switchTab('お部屋')" id="tab-お部屋">🏠 お部屋</button>
    <button class="tab-btn" onclick="switchTab('ステータス')" id="tab-ステータス">📊 ステータス</button>
  </div>

  <!-- ===== 育てるページ ===== -->
  <div class="page active" id="page-育てる">
    <div class="chara-card">
      <div id="chara-img-wrap"><img id="chara-img" src="egg_default.png" alt="ムスカムスカ"></div>
      <div class="outfit-row">
        <button class="outfit-btn active" onclick="setOutfit('default')" id="outfit-default">🖤 デフォ</button>
        <button class="outfit-btn" onclick="setOutfit('casual')" id="outfit-casual">💚 カジュアル</button>
        <button class="outfit-btn" onclick="setOutfit('fancy')" id="outfit-fancy">💜 おしゃれ</button>
        <button class="outfit-btn" onclick="setOutfit('sleep')" id="outfit-sleep">🌙 パジャマ</button>
      </div>
      <div class="chara-name">ムスカムスカ</div>
      <div class="chara-level" id="chara-level">Lv.1 ・ たまご期</div>
      <div class="mood-badge" id="mood-badge" style="background:#e8f5e3;color:#5a7a48;">😐 ふつう</div>
      <div class="exp-row">
        <span class="exp-lbl">EXP</span>
        <div class="bar-bg" style="flex:1"><div class="bar-fill" id="exp-bar" style="width:0%;background:#3aada0;"></div></div>
        <span class="exp-num" id="exp-num">0/30</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">きもち</div>
      <div class="stat-row" style="margin-bottom:10px;">
        <span class="stat-label">🪰 性格</span>
        <span id="personality-badge" style="font-size:12px;font-weight:700;padding:3px 12px;border-radius:100px;background:#e8f5e3;color:#3aada0;">まだわからない</span>
      </div>
      <div class="stat-row special-stat">
        <span class="stat-label">💗 なつき度</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-love" style="width:30%;background:#d4537e;"></div></div>
        <span class="stat-val" id="val-love">30</span>
      </div>
      <div class="stat-row special-stat">
        <span class="stat-label">🍙 おなか</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-hunger" style="width:70%;background:#c49a2a;"></div></div>
        <span class="stat-val" id="val-hunger">70</span>
      </div>
      <div class="stat-row special-stat">
        <span class="stat-label">🛁 清潔度</span>
        <div class="bar-bg"><div class="bar-fill" id="bar-clean" style="width:80%;background:#3aada0;"></div></div>
        <span class="stat-val" id="val-clean">80</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">育てる</div>
      <div class="btn-grid">
        <button class="action-btn" id="btn-train" onclick="doAction('train')">⚔️ 修行させる</button>
        <button class="action-btn" id="btn-study" onclick="doAction('study')">📖 勉強させる</button>
        <button class="action-btn" id="btn-play"  onclick="doAction('play')">🎉 遊ばせる</button>
        <button class="action-btn" id="btn-rest"  onclick="doAction('rest')">🌙 休ませる</button>
        <button class="action-btn" id="btn-feed"  onclick="doAction('feed')">🍙 ごはん</button>
        <button class="action-btn" id="btn-bath"  onclick="doAction('bath')">🛁 お風呂</button>
        <button class="action-btn" id="btn-pet"   onclick="doAction('pet')">🫶 なでる</button>
        <button class="action-btn" id="btn-walk"  onclick="goWalk()" style="grid-column:span 2">🚶 お散歩に行く</button>
      </div>
      <div class="auto-wrap">
        <input type="checkbox" id="auto-cb" onchange="toggleAuto()">
        <label for="auto-cb">オート育成（3秒ごとに自動行動）</label>
      </div>
    </div>

    <div class="card">
      <div class="section-title">おやつストック</div>
      <div class="snack-grid" id="snack-grid"><span class="snack-empty">まだ何もない…お散歩で拾ってこよう</span></div>
    </div>

    <div class="card">
      <div class="section-title">ログ</div>
      <div class="log" id="log">ムスカムスカが誕生した。大切に育てよう！</div>
    </div>
  </div>

  <!-- ===== お部屋ページ ===== -->
  <div class="page" id="page-お部屋">
    <div id="room-wrap">
      <div id="room-canvas-wrap">
        <div id="room-bg"></div>
        <div id="room-floor"></div>
        <div id="room-furniture-layer"></div>
        <!-- むすむすSVGアイコン -->
        <div id="room-musumu" style="left:40%;">
          <svg viewBox="0 0 130 120" xmlns="http://www.w3.org/2000/svg">
            <style>
              @keyframes rw{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0.55)}}
              @keyframes rb{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
              .rw{animation:rw 0.13s linear infinite;}
              .rb{animation:rb 0.55s ease-in-out infinite;transform-origin:65px 55px;}
            </style>
            <g class="rw" style="transform-origin:38px 30px"><ellipse cx="38" cy="30" rx="28" ry="12" fill="#b8f0e8" stroke="#3aada0" stroke-width="1.2"/></g>
            <g class="rw" style="transform-origin:92px 30px"><ellipse cx="92" cy="30" rx="28" ry="12" fill="#b8f0e8" stroke="#3aada0" stroke-width="1.2"/></g>
            <g class="rb">
              <line x1="56" y1="16" x2="47" y2="4" stroke="#2bbdb2" stroke-width="2" stroke-linecap="round"/>
              <circle cx="46" cy="3" r="4" fill="#2bbdb2"/>
              <line x1="74" y1="16" x2="83" y2="4" stroke="#2bbdb2" stroke-width="2" stroke-linecap="round"/>
              <circle cx="84" cy="3" r="4" fill="#2bbdb2"/>
              <circle cx="65" cy="34" r="24" fill="#4ecdc4"/>
              <circle cx="47" cy="37" r="13" fill="#4ecdc4"/>
              <circle cx="83" cy="37" r="13" fill="#4ecdc4"/>
              <ellipse cx="65" cy="48" rx="20" ry="18" fill="#f5ede0"/>
              <ellipse cx="55" cy="46" rx="9" ry="10" fill="#111"/>
              <ellipse cx="75" cy="46" rx="9" ry="10" fill="#111"/>
              <circle cx="52" cy="42" r="3" fill="white" opacity="0.85"/>
              <circle cx="72" cy="42" r="3" fill="white" opacity="0.85"/>
              <ellipse cx="44" cy="53" rx="6" ry="3" fill="#f0a0b8" opacity="0.5"/>
              <ellipse cx="86" cy="53" rx="6" ry="3" fill="#f0a0b8" opacity="0.5"/>
              <rect x="57" y="64" width="16" height="32" rx="6" fill="#2a2a2a"/>
              <rect x="52" y="94" width="10" height="22" rx="4" fill="#f5ede0"/>
              <rect x="68" y="94" width="10" height="22" rx="4" fill="#f5ede0"/>
              <line x1="47" y1="67" x2="35" y2="82" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="83" y1="67" x2="95" y2="82" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
      </div>
      <div class="room-controls">
        <div class="room-subtitle">壁紙</div>
        <div class="room-ctrl-row" id="wallpaper-row"></div>
        <div class="room-subtitle" style="margin-top:8px;">床</div>
        <div class="room-ctrl-row" id="floor-row"></div>
        <div class="room-subtitle" style="margin-top:8px;">家具インベントリ（タップで設置）</div>
        <div class="furniture-inv" id="furniture-inv"></div>
        <div class="room-subtitle" style="margin-top:10px;">💗 なつき度プレゼント</div>
        <div class="gift-row" id="gift-row"></div>
      </div>
    </div>
  </div>

  <!-- ===== ステータスページ ===== -->
  <div class="page" id="page-ステータス">
    <div class="card">
      <div class="section-title">ステータス</div>
      <div class="stat-row"><span class="stat-label">💪 ちから</span><div class="bar-bg"><div class="bar-fill" id="bar-str" style="width:10%;background:#e07a5f;"></div></div><span class="stat-val" id="val-str">10</span></div>
      <div class="stat-row"><span class="stat-label">✨ まほう</span><div class="bar-bg"><div class="bar-fill" id="bar-mag" style="width:10%;background:#7f77dd;"></div></div><span class="stat-val" id="val-mag">10</span></div>
      <div class="stat-row"><span class="stat-label">💨 すばやさ</span><div class="bar-bg"><div class="bar-fill" id="bar-spd" style="width:10%;background:#3aada0;"></div></div><span class="stat-val" id="val-spd">10</span></div>

function getPersonality(){
  const c=state.actionCount||{};let mx=null,mv=0,tot=0;
  for(const[k,v]of Object.entries(c)){tot+=v;if(v>mv){mv=v;mx=k;}}
  return(tot<10||!mx)?null:(PERSONALITIES[mx]||null);
}
function applyMult(type,val){
  const p=getPersonality();if(!p||!val)return val;
  return p[type+'Mult']?Math.round(val*p[type+'Mult']):val;
}

const SAVE_KEY='musukamosuka_save';
const DEFAULT_STATE={lv:1,exp:0,str:10,mag:10,spd:10,hp:10,luk:10,energy:70,love:30,hunger:70,clean:80,busy:false,
  actionCount:{train:0,study:0,play:0,rest:0,bath:0,pet:0,feed:0,walk:0}};

function saveGame(){
  const d={state:{...state,busy:false},outfit:currentOutfit,snacks:[...snackStock],
    furniture:furnitureInventory,roomData:{wallpaper:currentWallpaper,floor:currentFloor,placed:[...placedFurniture]},
    giftGiven:[...giftGiven],savedAt:Date.now()};
  localStorage.setItem(SAVE_KEY,JSON.stringify(d));updateSaveInfo();
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const d=JSON.parse(raw);
    state={...DEFAULT_STATE,...d.state,busy:false,actionCount:{...DEFAULT_STATE.actionCount,...(d.state?.actionCount||{})}};
    currentOutfit=d.outfit||'default';
    snackStock=d.snacks||[];
    furnitureInventory={...d.furniture||{}};
    if(d.roomData){currentWallpaper=d.roomData.wallpaper||'default';currentFloor=d.roomData.floor||'default';placedFurniture=[...d.roomData.placed||[]];}
    giftGiven=new Set(d.giftGiven||[]);
    return d.savedAt||null;
  }catch(e){return false;}
}
function resetGame(){
  if(!confirm('セーブデータを消して最初からやり直す？'))return;
  localStorage.removeItem(SAVE_KEY);
  state={...DEFAULT_STATE};currentOutfit='default';snackStock=[];
  furnitureInventory={};placedFurniture=[];giftGiven=new Set();
  currentWallpaper='default';currentFloor='default';
  setOutfit('default');updateSaveInfo();renderSnacks();renderRoom();render();
  addLog('ムスカムスカが誕生した。大切に育てよう！');
}
function updateSaveInfo(){
  const raw=localStorage.getItem(SAVE_KEY);const el=document.getElementById('save-info');
  if(!raw){el.textContent='💾 セーブデータなし';return;}
  try{const d=JSON.parse(raw);const dt=new Date(d.savedAt);
    el.textContent=`💾 ${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')} 自動セーブ済み`;
  }catch{el.textContent='💾 セーブあり';}
}

let state={...DEFAULT_STATE};
let autoTimer=null,currentOutfit='default',snackStock=[];
let furnitureInventory={};
let placedFurniture=[];
let currentWallpaper='default',currentFloor='default';
let giftGiven=new Set();

function getStage(){let s=STAGES[0];for(const st of STAGES)if(state.lv>=st.lv)s=st;return s;}
function getMood(){for(const m of MOODS)if(state.love>=m.min)return m;return MOODS[MOODS.length-1];}
function cap(v,mn=0,mx=100){return Math.min(mx,Math.max(mn,v));}

// タブ切り替え
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
  if(name==='お部屋')renderRoom();
  if(name==='ステータス')renderCollection();
}

function setOutfit(name){
  currentOutfit=name;updateCharaImg();
  document.querySelectorAll('.outfit-btn').forEach(b=>b.classList.toggle('active',b.id==='outfit-'+name));
  bounceChara();
}
function updateCharaImg(){
  const stage=getStage();const src=`${stage.img}_${currentOutfit}.png`;
  const img=document.getElementById('chara-img');
  img.style.opacity='0';setTimeout(()=>{img.src=src;img.style.opacity='1';},150);
}

function doAction(type){
  if(state.busy)return;
  const a=ACTIONS[type];
  if(a.energy&&a.energy<0&&state.energy+a.energy<0){addLog("エネルギーが足りない…休ませよう😮‍💨");return;}
  state.busy=true;setBtns(true);
  if(!state.actionCount)state.actionCount={};
  state.actionCount[type]=(state.actionCount[type]||0)+1;
  addLog(a.logs[Math.floor(Math.random()*a.logs.length)]);
  if(a.energy) state.energy=cap(state.energy+a.energy);
  if(a.str)    state.str=cap(state.str+applyMult('str',a.str),0,999);
  if(a.mag)    state.mag=cap(state.mag+applyMult('mag',a.mag),0,999);
  if(a.spd)    state.spd=cap(state.spd+a.spd,0,999);
  if(a.hp)     state.hp=cap(state.hp+applyMult('hp',a.hp),0,999);
  if(a.luk)    state.luk=cap(state.luk+applyMult('luk',a.luk),0,999);
  if(a.love)   state.love=cap(state.love+applyMult('love',a.love));
  if(a.hunger) state.hunger=cap(state.hunger+a.hunger);
  if(a.clean)  state.clean=cap(state.clean+applyMult('bath',a.clean));
  state.exp+=Math.floor(Math.random()*6)+3;
  checkLevelUp();checkGifts();bounceChara();render();saveGame();
  setTimeout(()=>{state.busy=false;setBtns(false);tryNatsukiEvent();},700);
}

function eatSnack(key){
  if(state.busy)return;
  const s=SNACKS[key];if(!s)return;
  const idx=snackStock.indexOf(key);if(idx===-1)return;
  snackStock.splice(idx,1);addLog(s.msg);
  state.hunger=cap(state.hunger+s.hunger);
  state.love=cap(state.love+s.love);
  state.clean=cap(state.clean+s.clean);
  if(s.gii)showGii();else bounceChara();
  render();renderSnacks();saveGame();
}
function renderSnacks(){
  const grid=document.getElementById('snack-grid');
  if(!snackStock.length){grid.innerHTML='<span class="snack-empty">まだ何もない…お散歩で拾ってこよう</span>';return;}
  const cnt={};snackStock.forEach(k=>{cnt[k]=(cnt[k]||0)+1;});
  grid.innerHTML='';
  for(const[key,c]of Object.entries(cnt)){
    const s=SNACKS[key];if(!s)continue;
    const btn=document.createElement('button');btn.className='snack-chip';
    btn.textContent=`${s.label}×${c}`;btn.onclick=()=>eatSnack(key);
    grid.appendChild(btn);
  }
}

function goWalk(){
  if(state.busy)return;
  if(state.clean<20){addLog("よごれすぎてて外に出られない…お風呂に入ろう🛁");return;}
  state.busy=true;setBtns(true);
  const place=WALK_EVENTS[Math.floor(Math.random()*WALK_EVENTS.length)];
  const ev=place.events[Math.floor(Math.random()*place.events.length)];
  let resultText=ev.result;
  if(ev.furniture&&FURNITURE_DEF[ev.furniture]){
    const fd=FURNITURE_DEF[ev.furniture];
    furnitureInventory[ev.furniture]=(furnitureInventory[ev.furniture]||0)+1;
    resultText+=`　${fd.emoji}${fd.label}をひろった！`;
  }
  document.getElementById('walk-title').textContent=`🚶 ${place.place}にいった`;
  document.getElementById('walk-scene').textContent=place.scene;
  document.getElementById('walk-desc').textContent=ev.desc;
  document.getElementById('walk-result').textContent=resultText;
  document.getElementById('walk-modal').classList.add('show');
  if(ev.love)  state.love=cap(state.love+ev.love);
  if(ev.clean) state.clean=cap(state.clean+ev.clean);
  state.hunger=cap(state.hunger-8);
  state.actionCount=state.actionCount||{};
  state.actionCount['walk']=(state.actionCount['walk']||0)+1;
  const base=Math.floor(Math.random()*8)+5;
  state.exp+=applyMult('walkExp',base);
  if(ev.snack) snackStock.push(ev.snack);
  if(ev.gii)   setTimeout(()=>showGii(),400);
  checkLevelUp();checkGifts();render();renderSnacks();saveGame();
}
function closeWalk(){
  document.getElementById('walk-modal').classList.remove('show');
  bounceChara();state.busy=false;setBtns(false);
}

// なつき度プレゼント
function checkGifts(){
  for(const g of GIFTS){
    if(!giftGiven.has(g.key)&&state.love>=g.lv){
      giftGiven.add(g.key);
      furnitureInventory[g.key]=(furnitureInventory[g.key]||0)+1;
      document.getElementById('gift-scene').textContent=g.emoji;
      document.getElementById('gift-desc').textContent=`なつき度${g.lv}に達した！\n${g.label}\nお部屋に飾ってあげよう🏠`;
      document.getElementById('gift-modal').classList.add('show');
      renderGiftRow();
      break;
    }
  }
}
function closeGift(){document.getElementById('gift-modal').classList.remove('show');saveGame();}

function renderGiftRow(){
  const row=document.getElementById('gift-row');if(!row)return;
  row.innerHTML='';
  for(const g of GIFTS){
    const unlocked=giftGiven.has(g.key)||state.love>=g.lv;
    const div=document.createElement('div');
    div.className='gift-item'+(unlocked?' unlocked':'');
    div.innerHTML=`${g.emoji} なつき度${g.lv}`;
    if(unlocked)div.title=FURNITURE_DEF[g.key].label+'をゲット済み';
    row.appendChild(div);
  }
}

// ========== お部屋 ==========
let dragTarget=null,dragOffX=0,dragOffY=0;

function renderRoom(){
  // 壁紙
  const wp=WALLPAPERS.find(w=>w.id===currentWallpaper)||WALLPAPERS[0];
  document.getElementById('room-bg').style.background=wp.bg;
  // 床
  const fl=FLOORS.find(f=>f.id===currentFloor)||FLOORS[0];
  document.getElementById('room-floor').style.background=fl.bg;
  // 壁紙ボタン
  const wrow=document.getElementById('wallpaper-row');
  wrow.innerHTML='';
  WALLPAPERS.forEach(w=>{
    const b=document.createElement('button');b.className='room-chip'+(w.id===currentWallpaper?' active':'');
    b.textContent=w.label;b.onclick=()=>{currentWallpaper=w.id;renderRoom();saveGame();};wrow.appendChild(b);
  });
  // 床ボタン
  const frow=document.getElementById('floor-row');
  frow.innerHTML='';
  FLOORS.forEach(f=>{
    const b=document.createElement('button');b.className='room-chip'+(f.id===currentFloor?' active':'');
    b.textContent=f.label;b.onclick=()=>{currentFloor=f.id;renderRoom();saveGame();};frow.appendChild(b);
  });
  // 設置済み家具
  const layer=document.getElementById('room-furniture-layer');
  layer.innerHTML='';
  placedFurniture.forEach((item,i)=>{
    const el=document.createElement('div');
    el.className='furniture';el.textContent=FURNITURE_DEF[item.key]?.emoji||'❓';
    el.style.left=item.x+'%';el.style.bottom=item.y+'%';
    el.dataset.idx=i;
    el.addEventListener('pointerdown',onFurniturePointerDown);
    layer.appendChild(el);
  });
  // インベントリ
  const inv=document.getElementById('furniture-inv');
  inv.innerHTML='';
  let hasItem=false;
  for(const[key,cnt]of Object.entries(furnitureInventory)){
    if(cnt<=0)continue;hasItem=true;
    const fd=FURNITURE_DEF[key];if(!fd)continue;
    const el=document.createElement('div');el.className='inv-item';
    el.textContent=fd.emoji;el.title=fd.label;
    const badge=document.createElement('span');badge.className='inv-badge';badge.textContent=cnt;
    el.appendChild(badge);
    el.onclick=()=>placeFurniture(key);
    inv.appendChild(el);
  }
  if(!hasItem)inv.innerHTML='<span class="inv-empty">お散歩で家具を拾ってこよう🚶</span>';
  renderGiftRow();
}

function placeFurniture(key){
  if((furnitureInventory[key]||0)<=0)return;
  furnitureInventory[key]--;
  placedFurniture.push({key,x:30+Math.random()*40,y:5+Math.random()*20});
  renderRoom();saveGame();
}

// ドラッグ
function onFurniturePointerDown(e){
  e.preventDefault();
  document.body.style.overflow='hidden';
  dragTarget=e.currentTarget;dragTarget.classList.add('dragging');dragTarget.setPointerCapture(e.pointerId);
  const wrap=document.getElementById('room-canvas-wrap');
  const rect=wrap.getBoundingClientRect();
  dragOffX=((e.clientX-rect.left)/rect.width)*100-parseFloat(dragTarget.style.left);
  dragOffY=((rect.bottom-e.clientY)/rect.height)*100-parseFloat(dragTarget.style.bottom);
  dragTarget.addEventListener('pointermove',onFurniturePointerMove);
  dragTarget.addEventListener('pointerup',onFurniturePointerUp);
}
function onFurniturePointerMove(e){
  if(!dragTarget)return;
  const wrap=document.getElementById('room-canvas-wrap');
  const rect=wrap.getBoundingClientRect();
  let nx=((e.clientX-rect.left)/rect.width)*100-dragOffX;
  let ny=((rect.bottom-e.clientY)/rect.height)*100-dragOffY;
  nx=Math.max(0,Math.min(88,nx));ny=Math.max(0,Math.min(60,ny));
  dragTarget.style.left=nx+'%';dragTarget.style.bottom=ny+'%';
  const idx=parseInt(dragTarget.dataset.idx);
  if(placedFurniture[idx]){placedFurniture[idx].x=nx;placedFurniture[idx].y=ny;}
}
function onFurniturePointerUp(e){
  if(!dragTarget)return;
  document.body.style.overflow='';
  dragTarget.classList.remove('dragging');
  dragTarget.removeEventListener('pointermove',onFurniturePointerMove);
  dragTarget.removeEventListener('pointerup',onFurniturePointerUp);
  dragTarget=null;saveGame();
}

// むすむすをお部屋でうろうろ
function musumuWalk(){
  const el=document.getElementById('room-musumu');if(!el)return;
  const nx=5+Math.random()*75;
  el.style.left=nx+'%';
}
setInterval(musumuWalk,3000);

// コレクション表示
function renderCollection(){
  const el=document.getElementById('collection-list');if(!el)return;
  const all=Object.keys(FURNITURE_DEF);
  const owned=new Set(Object.keys(furnitureInventory).filter(k=>furnitureInventory[k]>0));
  placedFurniture.forEach(p=>owned.add(p.key));
  el.innerHTML=all.map(k=>{
    const fd=FURNITURE_DEF[k];
    const got=owned.has(k)||giftGiven.has(k);
    return `<span style="opacity:${got?1:0.3}">${fd.emoji} ${fd.label}</span>`;
  }).join('　');
}

function showGii(){
  const el=document.getElementById('gii-msg');
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1400);
}
function checkLevelUp(){
  let needed=EXP_PER_LV(state.lv);
  while(state.exp>=needed){state.exp-=needed;state.lv++;showLvUp(state.lv);needed=EXP_PER_LV(state.lv);}
}
function showLvUp(lv){
  const el=document.getElementById('lvup-msg');
  el.textContent=`🎉 Lv.${lv} レベルアップ！`;el.style.display='block';el.style.animation='none';
  void el.offsetWidth;el.style.animation='lvup 1.3s ease forwards';
  setTimeout(()=>{el.style.display='none';},1300);
}
function bounceChara(){
  const w=document.getElementById('chara-img-wrap');
  w.classList.remove('bounce');void w.offsetWidth;w.classList.add('bounce');
}
function addLog(msg){
  const el=document.getElementById('log');el.textContent=msg;
  el.classList.remove('log-flash');void el.offsetWidth;el.classList.add('log-flash');
}
function setBtns(d){
  ['btn-train','btn-study','btn-play','btn-rest','btn-feed','btn-bath','btn-pet','btn-walk']
    .forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=d;});
}
function render(){
  const stage=getStage();const mood=getMood();const needed=EXP_PER_LV(state.lv);
  document.getElementById('chara-level').textContent=`Lv.${state.lv} ・ ${stage.name}`;
  updateCharaImg();
  const mb=document.getElementById('mood-badge');mb.textContent=mood.text;mb.style.background=mood.bg;mb.style.color=mood.col;
  document.getElementById('exp-bar').style.width=Math.min(100,Math.round(state.exp/needed*100))+'%';
  document.getElementById('exp-num').textContent=`${state.exp}/${needed}`;
  ['str','mag','spd','hp','luk'].forEach(k=>{
    document.getElementById('bar-'+k).style.width=Math.min(100,state[k])+'%';
    document.getElementById('val-'+k).textContent=state[k];
  });
  document.getElementById('bar-love').style.width=state.love+'%';document.getElementById('val-love').textContent=state.love;
  document.getElementById('bar-hunger').style.width=state.hunger+'%';document.getElementById('val-hunger').textContent=state.hunger;
  document.getElementById('bar-clean').style.width=state.clean+'%';document.getElementById('val-clean').textContent=state.clean;
  const p=getPersonality();const pb=document.getElementById('personality-badge');
  if(p){pb.textContent=`${p.emoji} ${p.name}`;pb.style.background=p.bg;pb.style.color=p.color;pb.title=p.desc;}
  else{pb.textContent='まだわからない';pb.style.background='#e8f5e3';pb.style.color='#3aada0';}
  if(state.hunger<=10){addLog("おなかがすいた…ごはんをちょうだい🍙");state.love=cap(state.love-1);}
  if(state.clean<=15) addLog("よごれてる…お風呂に入れてあげよう🛁");
  const bb=document.getElementById('btn-bath');if(bb)bb.classList.toggle('highlight',state.clean<30);
}
function toggleAuto(){
  const cb=document.getElementById('auto-cb');
  if(cb.checked){
    const acts=['train','study','play','rest','bath','pet'];
    autoTimer=setInterval(()=>{
      if(state.hunger<25)doAction('feed');
      else if(state.clean<30)doAction('bath');
      else doAction(acts[Math.floor(Math.random()*acts.length)]);
    },3000);
  }else{clearInterval(autoTimer);autoTimer=null;}
}

const NATSUKI_EVENTS=[
  {key:"sleep",   icon:"🪰💤",text:"手によじ登ってきた！\n羽をぷるぷるさせている……\nそのまま寝ちゃった。"},
  {key:"stare",   icon:"🪰👀",text:"じっとこちらを見ている。\n目が合った。\nそらさない。"},
  {key:"sniff",   icon:"🪰👃",text:"においをかいでいる。\nしばらくして、\n気に入ったらしい。"},
  {key:"sleeve",  icon:"🪰🧥",text:"服の袖にもぐりこんできた。\nあったかいらしく、\nもう出てこない。"},
  {key:"shoulder",icon:"🪰🫱",text:"肩に乗ってきた。\n動いたら落ちそうで、\nしばらく動けなかった。"},
  {key:"wings",   icon:"🪰✨",text:"羽をぷるぷるさせながら\n近づいてきた。\nなにか伝えたいらしい。"},
];
let lastNatsukiCheck=0;
function tryNatsukiEvent(){
  if(state.love<80||state.lv<3)return;
  const now=Date.now();if(now-lastNatsukiCheck<180000)return;
  lastNatsukiCheck=now;if(Math.random()>0.05)return;
  const ev=NATSUKI_EVENTS[Math.floor(Math.random()*NATSUKI_EVENTS.length)];
  const stage=getStage();
  const imgFile=`event_${ev.key}_${stage.img}.png`;
  const nImg=document.getElementById('natsuki-img');
  const nIcon=document.getElementById('natsuki-icon');
  const test=new Image();
  test.onload=()=>{nImg.src=imgFile;nImg.style.display='block';nIcon.style.display='none';};
  test.onerror=()=>{nIcon.textContent=ev.icon;nIcon.style.display='block';nImg.style.display='none';};
  test.src=imgFile;
  document.getElementById('natsuki-text').textContent=ev.text;
  document.getElementById('natsuki-modal').classList.add('show');
}
function closeNatsuki(){document.getElementById('natsuki-modal').classList.remove('show');}
